name: flutter_pokedex
description: "Code challenge para Flutter Developers."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  dio: ^5.8.0+1
  freezed: ^2.5.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  hive_flutter: ^1.1.0
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  get_it: ^8.0.3
  navigation:
    path: ./navigation
  app_localizations:
    path: ./app_localizations
  
  retrofit: ^4.4.2
  retrofit_generator: ^8.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  animate_do: ^4.2.0
  dropdown_button2: ^2.3.9
  hive_generator: ^2.0.1
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.14.3

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/pokedex.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: scaleAspectFit
  branding: null

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/pokedex_icon.png

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  build_runner: ^2.4.11
  mockito: ^5.4.4
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/l10n/
